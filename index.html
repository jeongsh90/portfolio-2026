<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>포트폴리오 · [이름을 입력하세요]</title>
  <meta name="description" content="[직군 / 하는 일을 한 줄로] — 포트폴리오" />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body class="loading">
  <a class="skip-link" href="#gallery">본문으로 건너뛰기</a>

  <header class="frame">
    <div class="frame__id">
      <p class="frame__name" data-bind="name"></p>
      <p class="frame__role" data-bind="role"></p>
    </div>
    <a class="frame__link" data-bind-href="emailHref" data-bind="email"></a>
  </header>

  <p class="scroll-hint" aria-hidden="true">
    <span>Scroll</span>
  </p>

  <main id="gallery" class="gallery-section" aria-label="포트폴리오 갤러리">
    <div class="gallery-track" id="galleryTrack"></div>
  </main>

  <svg class="cursor" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
    <circle class="cursor__inner" cx="10" cy="10" r="5" />
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
